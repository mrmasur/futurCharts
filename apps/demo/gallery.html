<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>futurCharts — galerie</title>
    <style>
      :root { --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --border: rgba(11, 11, 11, 0.1); }
      :root[data-theme='dark'] { --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --border: rgba(255, 255, 255, 0.1); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 24px 24px 8px; max-width: 1500px; margin: 0 auto; }
      header a { color: inherit; }
      h1 { font-size: 20px; margin: 0; font-weight: 650; }
      header p { margin: 0; color: var(--ink-2); flex: 1; min-width: 200px; }
      button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
      main { padding: 0 24px 32px; max-width: 1500px; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
      section { scroll-margin-top: 64px; }
      h2 { font-size: 15px; font-weight: 650; margin: 28px 0 12px; }
      nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 24px; max-width: 1500px; margin: 0 auto; background: var(--plane); }
      nav a { color: var(--ink-2); text-decoration: none; font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
      nav a:hover { color: var(--ink); }
      .palette { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
      select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
      figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      figure.wide { grid-column: span 2; }
      @media (max-width: 960px) { figure.wide { grid-column: auto; } }
      .chart { height: 340px; }
      .chart.auto { height: auto; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .tiles .chart { height: 190px; }
      .tiles .chart + .chart { border-left: 1px solid var(--border); }
      figcaption { padding: 8px 16px 12px; color: var(--ink-2); font-size: 12px; border-top: 1px solid var(--border); }
      figcaption code { font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>futurCharts — galerie</h1>
      <p>Chaque graphique est une spec JSON. Survolez pour les infobulles, cliquez la légende pour masquer une série.</p>
      <a href="/">Graphiques</a>
      <a href="/maps.html">Cartes</a>
      <a href="/wrappers.html">Wrappers</a>
      <label class="palette">Couleurs <select id="palette"></select></label>
      <button id="theme" type="button">Thème sombre</button>
    </header>
    <nav id="groups"></nav>
    <main id="grid"></main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
