<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>futurCharts</title>
    <style>
      :root {
        --plane: #f4f4f1;
        --surface: #fcfcfb;
        --side: #fbfbf9;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --border: rgba(11, 11, 11, 0.09);
        --hover: rgba(11, 11, 11, 0.05);
        --accent: #2a78d6;
        --accent-soft: rgba(42, 120, 214, 0.1);
        --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --plane: #0d0d0d;
        --surface: #1a1a19;
        --side: #141413;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --border: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.06);
        --accent: #3987e5;
        --accent-soft: rgba(57, 135, 229, 0.16);
        --shadow: none;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--plane); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      button, select { font: inherit; color: inherit; }

      .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }

      /* Sidebar */
      .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
      .brand svg { flex: none; }
      .nav h3 { margin: 0 0 6px; padding: 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .nav a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
      .nav a:hover { background: var(--hover); color: var(--ink); }
      .nav a[aria-current='page'] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
      .nav a .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .nav a svg { flex: none; color: var(--muted); }
      .nav a[aria-current='page'] svg { color: var(--accent); }
      .side .foot { margin-top: auto; padding: 0 8px; font-size: 11px; color: var(--muted); }

      /* Header */
      .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--plane) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
      .titles { flex: 1 1 260px; min-width: 0; }
      .titles h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
      .titles p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
      .filters, .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
      .seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
      .seg button[aria-pressed='true'] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
      select, .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
      .btn:hover, select:hover { border-color: color-mix(in srgb, var(--ink) 25%, transparent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 28px 0; }
      .chips:empty { display: none; }
      .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--ink); border: 0; border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 12px; cursor: pointer; }
      .chip span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--hover); }

      /* Board */
      .board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; padding: 16px 28px 40px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
      .card header { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 4px; }
      .card header div { flex: 1; min-width: 0; }
      .card h2 { margin: 0; font-size: 14px; font-weight: 600; }
      .card header p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
      .card .menu { border: 0; background: transparent; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
      .card .menu:hover { background: var(--hover); color: var(--ink); }
      .card .body { position: relative; min-height: 0; }
      .card .stack { height: auto !important; display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; }
      .card .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); height: auto !important; }
      .card .tiles > div { height: 176px !important; border-left: 1px solid var(--border); margin-left: -1px; }
      @media (max-width: 860px) { .card .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card .tiles > div { height: 156px !important; } }
      .card.bare header { position: absolute; right: 6px; top: 6px; padding: 0; z-index: 1; }
      .card.bare header div { display: none; }
      .card.bare { position: relative; }
      .card footer { padding: 6px 16px 12px; font-size: 11px; color: var(--muted); }
      .card pre { margin: 0; padding: 8px 16px; max-height: 110px; overflow: auto; border-top: 1px solid var(--border); font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); }
      .h-xs .body { height: 176px; } .h-s .body { height: 230px; } .h-m .body { height: 300px; } .h-l .body { height: 420px; }
      .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
      .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
      .nav a.sub { padding-left: 34px; font-size: 12.5px; }
      .search { width: min(360px, 60vw); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; color: var(--ink); }
      .board.gallery { display: block; }
      .gal-section { margin-bottom: 28px; }
      .gal-section .section-title { margin: 6px 0 12px; }
      .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .thumb { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
      .thumb:hover, .thumb:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08); border-color: var(--accent); outline: none; }
      .thumb .preview { height: 176px; pointer-events: none; }
      .thumb .meta { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
      .thumb h3 { margin: 0; font-size: 13px; font-weight: 600; }
      .thumb p { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .btn[aria-disabled='true'] { opacity: 0.4; pointer-events: none; }
      a.btn { color: var(--ink); text-decoration: none; }
      .card.info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 0; }
      .card.info .about { padding: 16px; border-right: 1px solid var(--border); }
      .card.info h2 { font-size: 13px; margin: 0 0 6px; }
      .card.info .about p { margin: 0 0 16px; color: var(--ink-2); font-size: 13px; }
      .card.info .tags code { display: inline-block; background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; margin: 0 4px 4px 0; font-size: 12px; }
      .card.info .code { min-width: 0; }
      .card.info .code-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
      .card.info pre { max-height: 420px; border-top: 0; font-size: 11.5px; }
      @media (max-width: 860px) { .card.info { grid-template-columns: minmax(0, 1fr); } .card.info .about { border-right: 0; border-bottom: 1px solid var(--border); } .thumbs { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
      .section-title { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

      /* Popover menu and JSON dialog */
      .popover { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16); padding: 4px; min-width: 190px; }
      .popover button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .popover button:hover { background: var(--hover); }
      dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(760px, 92vw); }
      dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
      dialog header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
      dialog header button { margin-left: auto; }
      dialog pre { margin: 0; padding: 16px; max-height: 70vh; overflow: auto; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }

      .menu-toggle { display: none; }
      @media (max-width: 1100px) {
        .span-3 { grid-column: span 6; } .span-4, .span-5, .span-7, .span-8 { grid-column: span 12; }
      }
      @media (max-width: 860px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 260px; transform: translateX(-100%); transition: transform 0.2s; }
        .app.open .side { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, 0.25); }
        .menu-toggle { display: inline-grid; }
        .top { padding: 12px 16px; }
        .board { padding: 12px 16px 32px; gap: 12px; }
        .chips { padding: 10px 16px 0; }
        .span-3, .span-6 { grid-column: span 12; }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side" id="side">
        <div class="brand">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="1.5" fill="#2a78d6" /><rect x="10" y="7" width="4" height="14" rx="1.5" fill="#1baf7a" /><rect x="17" y="3" width="4" height="18" rx="1.5" fill="#eb6834" /></svg>
          futurCharts
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="foot">Rendu WebGL2 · spec JSON</div>
      </aside>
      <div class="main">
        <div class="top">
          <button class="btn menu-toggle" id="menu-toggle" type="button" aria-label="Menu">☰</button>
          <div class="titles"><h1 id="title"></h1><p id="subtitle"></p></div>
          <div class="filters" id="filters"></div>
          <div class="tools">
            <select id="palette" aria-label="Couleurs"></select>
            <button class="btn" id="theme" type="button">Sombre</button>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <main class="board" id="board"></main>
      </div>
    </div>
    <dialog id="json"><header><span id="json-title">Spec JSON</span><button class="btn" type="button" id="json-close">Fermer</button></header><pre id="json-body"></pre></dialog>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
